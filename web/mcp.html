<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graph Viewer</title>
  <style>
    :root{color-scheme:light dark}
    html,body{height:100%;margin:0;background:light-dark(#f2f5f8,#141618);color:light-dark(#20303e,#eef0f0);font:13px system-ui,sans-serif}
    body{display:flex;flex-direction:column}
    header{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid light-dark(#dce3ea,#36393c)}
    #status{flex:1;min-width:0;overflow-wrap:anywhere}
    #status[data-error="true"]{color:light-dark(#a34b0c,#ffbf80)}
    #graph{flex:1;min-height:280px}
    button{padding:6px 10px;color:inherit;background:light-dark(#fff,#282c2f);border:1px solid light-dark(#c4cfd9,#4a5054);border-radius:6px;cursor:pointer}
    button:focus-visible{outline:2px solid light-dark(#2563eb,#7fb5ff)}
  </style>
</head>
<body>
  <header><span id="status" role="status">그래프 연결 대기</span><button id="retry" hidden>다시 연결</button></header>
  <main id="graph" aria-label="그래프" hidden></main>
  <!-- GRAPH_ENGINE -->
  <script>
    'use strict';
    const label=document.getElementById('status'), container=document.getElementById('graph'), retry=document.getElementById('retry');
    const pending=new Map(), openings=[];
    let seq=0, ready=false, displayMode, scope, sessionId, snapshot, view, hostTheme, interacting=false;
    let actions=[], running=false, stopped=false, stale=false, timer, reported='', saving=false;
    function message(text,error=false){label.textContent=text;label.dataset.error=String(error);}
    function sameScope(a,b){return a?.hostId===b?.hostId && a?.threadId===b?.threadId && (a?.projectPath || null)===(b?.projectPath || null);}
    function request(method,params){
      return new Promise((resolve,reject)=>{
        const id=++seq;
        const timer=setTimeout(()=>{pending.delete(id);reject(new Error('호스트 응답 시간 초과'));},8000);
        pending.set(id,{resolve,reject,timer});
        window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');
      });
    }
    async function call(binding,args){
      const response=await request('tools/call',{name:'graph_view',arguments:{...args,scope:binding.scope,sessionId:binding.sessionId}});
      if(response.isError){const error=response.structuredContent?.error;throw Object.assign(new Error(error?.message || '그래프 요청 실패'),{code:error?.code});}
      return response;
    }
    function localState(item){return {selectedNodeId:item.state.selectedNodeId,...item.state.views.large};}
    function savedMessage(){
      if(!snapshot)return;
      message(snapshot.graph.title+' / 버전 '+snapshot.revision+(actions.length || saving?' / 저장 중':' / 저장됨'));
    }
    function apply(next,force=false){
      if(snapshot && next.graph.graphId===snapshot.graph.graphId && (next.revision<snapshot.revision || next.revision===snapshot.revision && next.stateRevision<snapshot.stateRevision))return;
      const changed=!snapshot || next.graph.graphId!==snapshot.graph.graphId || next.revision!==snapshot.revision;
      if(changed)actions=[];
      snapshot=next;
      if(!view){
        container.hidden=false;
        view=GraphPanel.mount(container,{graph:next.graph,state:localState(next),hostTheme,
          onThemeChange(theme){document.documentElement.style.colorScheme=theme;},
          onAction(action){
            if(stale || !snapshot)return;
            const queued={graphId:snapshot.graph.graphId,revision:snapshot.revision,action};
            const last=actions.at(-1);
            if(last && !last.sending && last.action.type===action.type)actions[actions.length-1]=queued;
            else actions.push(queued);
            savedMessage();schedule(0);
          },
          onInteraction(value){interacting=value;if(!value)schedule(0);}
        });
        globalThis.graphPanelView=view;
      }else view.update(next.graph,force || changed || !interacting && !actions.length ? localState(next):undefined);
      document.title=next.graph.title;
      savedMessage();
    }
    function schedule(ms=1000){
      clearTimeout(timer);
      if(!stopped && !document.hidden)timer=setTimeout(loop,ms);
    }
    async function update(){
      while(openings.length){
        const candidate=openings.shift();
        if(scope && !sameScope(scope,candidate.scope))continue;
        try{
          const response=await call(candidate,{op:'sync'});
          const hidden=response._meta?.graphPanel;
          if(!hidden?.snapshot || !sameScope(hidden.scope,candidate.scope))throw new Error('그래프 연결 정보가 없습니다.');
          const replaced=sessionId!==candidate.sessionId;
          scope=candidate.scope;sessionId=candidate.sessionId;stale=false;retry.hidden=true;
          if(replaced){actions=[];snapshot=undefined;reported='';}
          apply(hidden.snapshot,true);
          document.body.dataset.threadId=scope.threadId;
        }catch(error){
          if(error.code!=='stale-session' && error.code!=='scope-mismatch'){
            openings.unshift(candidate);throw error;
          }
          if(!sessionId)message('그래프 연결 대기: '+error.message,true);
        }
      }
      if(!sessionId || stale)return;
      const binding={scope,sessionId};
      while(actions.length){
        const queued=actions[0];
        if(queued.graphId!==snapshot.graph.graphId || queued.revision!==snapshot.revision){actions.shift();continue;}
        queued.sending=true;saving=true;savedMessage();
        let response;
        try{response=await call(binding,{op:'action',graphId:queued.graphId,revision:queued.revision,expectedStateRevision:snapshot.stateRevision,action:queued.action});}
        catch(error){
          if(error.code==='revision-conflict' || error.code==='state-conflict'){
            actions=[];
            const latest=await call(binding,{op:'sync'});
            apply(latest._meta.graphPanel.snapshot,true);
            message(snapshot.graph.title+' / 최신 상태를 불러왔습니다.');
            return;
          }
          throw error;
        }finally{saving=false;}
        if(actions[0]===queued)actions.shift();
        apply(response._meta.graphPanel.snapshot);
      }
      const response=await call(binding,{op:'sync',knownGraphId:snapshot?.graph.graphId,knownRevision:snapshot?.revision,knownStateRevision:snapshot?.stateRevision});
      if(!response.structuredContent?.unchanged)apply(response._meta.graphPanel.snapshot);
      const report=JSON.stringify([sessionId,snapshot.graph.graphId,snapshot.revision,snapshot.stateRevision]);
      if(report!==reported && !actions.length && !interacting){
        await call(binding,{op:'ack',graphId:snapshot.graph.graphId,revision:snapshot.revision,stateRevision:snapshot.stateRevision,displayMode});
        reported=report;
      }
      savedMessage();
    }
    async function loop(){
      if(running || stopped || !ready || displayMode!=='fullscreen' || document.hidden)return;
      running=true;
      try{await update();}
      catch(error){
        if(error.code==='stale-session' || error.code==='scope-mismatch'){
          stale=true;actions=[];message('이 화면의 연결이 만료됐습니다. 그래프를 다시 여세요.',true);
        }else{message('연결 대기: '+error.message,true);retry.hidden=false;}
      }finally{running=false;schedule();}
    }
    function setMode(mode){
      displayMode=mode;document.body.dataset.hostDisplayMode=mode || 'unknown';
      container.hidden=mode!=='fullscreen' || !view;
      if(mode==='fullscreen')schedule(0);
      else message('그래프는 별도 탭에서 표시합니다. 현재 모드: '+(mode || '미확인'));
    }
    function applyHostTheme(theme){
      if(theme==='light' || theme==='dark'){
        hostTheme=theme;
        if(view)view.setHostTheme(hostTheme);
        else document.documentElement.style.colorScheme=hostTheme;
      }
    }
    addEventListener('message',event=>{
      if(event.source!==window.parent || event.data?.jsonrpc!=='2.0')return;
      const m=event.data,p=pending.get(m.id);
      if(p){pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result);return;}
      if(m.method==='ui/notifications/tool-result'){
        const binding=m.params?._meta?.graphPanel;
        if(binding?.scope && typeof binding.sessionId==='string'){
          openings.push({scope:binding.scope,sessionId:binding.sessionId});schedule(0);
        }
      }else if(m.method==='ui/notifications/host-context-changed'){
        applyHostTheme(m.params?.theme);
        if(m.params?.displayMode!==undefined)setMode(m.params.displayMode);
      }
    });
    retry.onclick=()=>schedule(0);
    addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else schedule(0);});
    addEventListener('pagehide',()=>{stopped=true;clearTimeout(timer);view?.destroy();},{once:true});
    async function start(){
      try{
        if(window.parent===window)throw new Error('Codex의 그래프 도구로 열어 주세요.');
        const host=await request('ui/initialize',{appInfo:{name:'graph-viewer',version:'1.2.0'},appCapabilities:{},protocolVersion:'2026-01-26'});
        window.parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');
        ready=true;applyHostTheme(host.hostContext?.theme);setMode(host.hostContext?.displayMode);
      }catch(error){message('연결 실패: '+error.message,true);}
    }
    void start();
  </script>
</body>
</html>
